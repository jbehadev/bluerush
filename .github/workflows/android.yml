name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-cargo-v2-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an SDK and NDK; using them avoids a ~1GB download.
      # The version tracks the runner image rather than being pinned here.
      - name: Locate Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "Using NDK at $ANDROID_NDK_LATEST_HOME"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # x86_64 is built alongside arm64 purely so the smoke test below can
      # run the real APK on an emulator; phones use the arm64 slice.
      - name: Build Rust cdylib (arm64 + x86_64)
        run: |
          cargo ndk -t arm64-v8a -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release --lib

      # Bevy's default `android_shared_stdcxx` feature links the Rust cdylib
      # against the shared C++ runtime. That .so lives in the NDK and is not
      # copied automatically, and without it dlopen fails at launch.
      - name: Bundle libc++_shared.so
        run: |
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          for pair in "arm64-v8a:aarch64-linux-android" "x86_64:x86_64-linux-android"; do
            abi="${pair%%:*}"; triple="${pair##*:}"
            SRC="$SYSROOT/$triple/libc++_shared.so"
            if [ ! -f "$SRC" ]; then
              echo "libc++_shared.so not found at $SRC"; exit 1
            fi
            cp "$SRC" "android/app/src/main/jniLibs/$abi/"
          done
          ls -la android/app/src/main/jniLibs/*/

      # Surfaces the two things that make the app die on launch: a missing
      # shared library, and which libs actually ended up inside the APK.
      - name: Inspect native libraries
        run: |
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          LIB=android/app/src/main/jniLibs/arm64-v8a/libbluerush.so
          echo "== libbluerush.so NEEDED entries =="
          "$READELF" -d "$LIB" | grep NEEDED

          # GameActivity's glue calls android_main, emitted by #[bevy_main].
          # If it is absent or not exported the app dies right after the
          # window appears, so fail the build rather than ship it.
          echo "== entry point symbols =="
          "$READELF" --dyn-syms "$LIB" \
            | grep -E "android_main|GameActivity|ANativeActivity" || true
          if ! "$READELF" --dyn-syms "$LIB" | grep -q " android_main"; then
            echo "FATAL: android_main is not exported from the cdylib"
            exit 1
          fi

          # Android 15 devices with 16 KB pages refuse to load libraries whose
          # LOAD segments are only 4 KB aligned.
          echo "== LOAD segment alignment =="
          "$READELF" -l "$LIB" | grep -A1 "LOAD" | head -8

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK contents
        run: |
          echo "== native libs packaged in the APK =="
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "\.so$" || true
          # Logcat proved the class is absent at runtime:
          #   ClassNotFoundException: com.google.androidgamesdk.GameActivity
          # A strings match is not enough, since a mere reference to the name
          # also matches. Ask dexdump which classes are actually DEFINED.
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          DEXDUMP=$(ls -d "$ANDROID_HOME"/build-tools/*/dexdump 2>/dev/null | tail -1)
          echo "== classes defined in the apk (androidgamesdk / gametextinput) =="
          mkdir -p /tmp/apkdex && unzip -o -q "$APK" "classes*.dex" -d /tmp/apkdex
          for dex in /tmp/apkdex/classes*.dex; do
            echo "-- $dex --"
            "$DEXDUMP" "$dex" | grep -E "Class descriptor" | sort -u | head -40
          done

          # GameActivity is present in the dex yet ART raises
          # ClassNotFoundException for it, which is what happens when the
          # application is marked hasCode="false": the framework never builds
          # a class loader over the apk's dex. This module has no Java sources
          # of its own, so check what the merger actually produced.
          echo "== hasCode in the merged manifest =="
          MM=$(find android/app/build/intermediates -name AndroidManifest.xml -path "*merged_manifest*" | head -1)
          echo "merged manifest: $MM"
          [ -n "$MM" ] && grep -oE 'hasCode="[a-z]+"' "$MM" || echo "hasCode not stated"

          echo "== what the resolved games-activity aar actually contains =="
          AAR=$(find ~/.gradle/caches -name "games-activity-*.aar" | head -1)
          echo "aar: $AAR"
          if [ -n "$AAR" ]; then
            unzip -l "$AAR"
            mkdir -p /tmp/aar && unzip -o -q "$AAR" -d /tmp/aar
            for jar in $(find /tmp/aar -name "*.jar"); do
              echo "-- $jar --"
              unzip -l "$jar" | head -40
            done
          fi

      # Static checks cannot tell us why the app dies on a real device, so run
      # the actual APK on an emulator and capture the crash from logcat.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.jbehadev.bluerush/com.google.androidgamesdk.GameActivity
            sleep 25
            echo "===== IS THE PROCESS ALIVE? ====="
            adb shell pidof com.jbehadev.bluerush || echo "PROCESS IS NOT RUNNING"
            adb logcat -d -v brief > /tmp/logcat.txt
            echo "===== CRASH / FATAL ====="
            grep -iE "FATAL|AndroidRuntime|beginning of crash|backtrace|signal |tombstone|libc " /tmp/logcat.txt | head -80
            echo "===== APP + RUST OUTPUT ====="
            grep -iE "bluerush|RustStdoutStderr|panic|GameActivity|gametextinput|wgpu|vulkan|winit|bevy" /tmp/logcat.txt | head -150
            echo "===== ACTIVITY MANAGER ====="
            grep -iE "ActivityManager|ActivityTaskManager" /tmp/logcat.txt | head -40

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BlueRush-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueRush-android-${{ steps.sha.outputs.short }}
          path: BlueRush-debug.apk
          if-no-files-found: error

      # Artifact downloads need a signed-in session and arrive zipped, which is
      # awkward on a phone. A release asset is a plain URL that installs with one
      # tap. Skipped for pull_request events, where forks get a read-only token.
      - name: Publish APK to rolling prerelease
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android test build
          prerelease: true
          body: |
            Debug APK built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Unsigned test build for sideloading, not a released version.
            arm64-v8a only; requires Android 7.0 (API 24) or newer.

            Touch input is not implemented yet: the toolbar responds to taps,
            but placing blocks, panning and zooming do not.
          files: BlueRush-debug.apk
