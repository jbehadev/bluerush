name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an SDK and NDK; using them avoids a ~1GB download.
      # The version tracks the runner image rather than being pinned here.
      - name: Locate Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "Using NDK at $ANDROID_NDK_LATEST_HOME"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust cdylib (arm64)
        run: |
          cargo ndk -t arm64-v8a \
            -o android/app/src/main/jniLibs \
            build --release --lib

      # Bevy's default `android_shared_stdcxx` feature links the Rust cdylib
      # against the shared C++ runtime. That .so lives in the NDK and is not
      # copied automatically, and without it dlopen fails at launch.
      - name: Bundle libc++_shared.so
        run: |
          SRC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          if [ ! -f "$SRC" ]; then
            echo "libc++_shared.so not found at $SRC"; exit 1
          fi
          cp "$SRC" android/app/src/main/jniLibs/arm64-v8a/
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      # Surfaces the two things that make the app die on launch: a missing
      # shared library, and which libs actually ended up inside the APK.
      - name: Inspect native libraries
        run: |
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          echo "== libbluerush.so NEEDED entries =="
          "$READELF" -d android/app/src/main/jniLibs/arm64-v8a/libbluerush.so \
            | grep NEEDED

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK contents
        run: |
          echo "== native libs packaged in the APK =="
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "\.so$" || true
          echo "== GameActivity class present? =="
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "classes.*\.dex" || true

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BlueRush-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueRush-android-${{ steps.sha.outputs.short }}
          path: BlueRush-debug.apk
          if-no-files-found: error

      # Artifact downloads need a signed-in session and arrive zipped, which is
      # awkward on a phone. A release asset is a plain URL that installs with one
      # tap. Skipped for pull_request events, where forks get a read-only token.
      - name: Publish APK to rolling prerelease
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android test build
          prerelease: true
          body: |
            Debug APK built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Unsigned test build for sideloading, not a released version.
            arm64-v8a only; requires Android 7.0 (API 24) or newer.

            Touch input is not implemented yet: the toolbar responds to taps,
            but placing blocks, panning and zooming do not.
          files: BlueRush-debug.apk
