[package]
name = "BlueRush"
version = "0.1.0"
edition = "2024"

# The game lives in a library so the Android build can produce a `cdylib` that
# the activity loads, while `src/main.rs` stays the desktop entry point.
[lib]
name = "bluerush"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "BlueRush"
path = "src/main.rs"

[dependencies]
# bevy must be declared here, not only in the target-specific sections below.
# Bevy's derive macros resolve their own crate path by looking for `bevy` in
# [dependencies]/[dev-dependencies] only (bevy_macro_utils::BevyManifest), and
# with it absent every #[derive(Component)]/#[derive(Resource)] silently stops
# generating its impl. No features are enabled here; each target adds its own.
bevy = { version = "0.18", default-features = false }
bevy_mesh = "0.18"
bevy_asset = "0.18"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Native file dialogs: desktop only. rfd has no Android backend, so it is not
# a dependency there and the save/load paths are cfg-gated in persistence.rs.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
# Bevy's normal default features.
bevy = { version = "0.18", default-features = false, features = ["2d", "3d", "ui"] }

# Android uses NativeActivity rather than Bevy's default GameActivity backend.
# GameActivity needs its Java class from the androidx.games aar, and that class
# could not be loaded at runtime (ClassNotFoundException) even once it was
# provably present in the dex. android.app.NativeActivity is part of the
# framework, so it always resolves and the apk needs no Java code at all.
#
# Selecting it means opting out of bevy's `default_platform` feature, which
# hardcodes android-game-activity. The list below is `default_platform` minus
# android-game-activity and the Linux window backends, plus the features the
# default `2d`/`3d`/`ui` meta-features pull in by way of default_platform.
[target.'cfg(target_os = "android")'.dependencies.bevy]
version = "0.18"
default-features = false
features = [
    "std",
    "android-native-activity",
    "android_shared_stdcxx",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "sysinfo_plugin",
    "default_app",
    "2d_bevy_render",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "audio",
    "picking",
]

# Enable optimizations for dependencies in debug builds (keeps game fast while iterating)
[profile.dev.package."*"]
opt-level = 3

# Keep your own code unoptimized for fast incremental compile + good debug info
[profile.dev]
opt-level = 0
