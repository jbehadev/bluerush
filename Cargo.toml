[package]
name = "BlueRush"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# Heightmap PNG decode/encode for the level system (levels/*.yaml + *.png).
image = { version = "0.25", default-features = false, features = ["png"] }

# Enable optimizations for dependencies in debug builds (keeps game fast while iterating)
[profile.dev.package."*"]
opt-level = 3

# Light optimisation for our own code: still quick to compile, but several times
# faster at runtime — scenery placement runs seconds of water sim at level load
# (`flood::predict_wet`), which takes ~1s+ unoptimised and ~0.2s at opt-level 1.
[profile.dev]
opt-level = 1
