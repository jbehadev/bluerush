plugins {
    id "com.android.application"
}

android {
    namespace "com.jbehadev.bluerush"
    compileSdk 35

    defaultConfig {
        applicationId "com.jbehadev.bluerush"
        // GameActivity needs 21+; wgpu's Vulkan backend wants a newer base.
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    // The Rust cdylib is placed here by cargo-ndk before the Gradle build runs.
    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    buildTypes {
        release {
            // Unsigned by default; CI publishes the debug APK for sideloading.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Supplies com.google.androidgamesdk.GameActivity, the activity that loads
    // the Rust cdylib.
    //
    // The version is NOT free to bump. android-activity (pulled in by Bevy's
    // default `android-game-activity` feature) vendors GameActivity's C++ and
    // registers its JNI methods against this exact Java class; GameActivity.h
    // in android-activity 0.6.0 declares 2.0.2. A mismatched .aar makes
    // RegisterNatives fail and the native code LOG_FATALs, which shows up as
    // the app opening fullscreen and immediately closing. Check
    // GAMEACTIVITY_{MAJOR,MINOR,BUGFIX}_VERSION in the android-activity source
    // before changing this.
    //
    // Deliberately the only dependency: GameActivity extends android.app.Activity,
    // so appcompat is not needed, and pulling it in produced duplicate Kotlin
    // stdlib classes.
    implementation "androidx.games:games-activity:2.0.2"
}
